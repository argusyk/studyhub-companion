[alembic]
script_location = alembic
prepend_sys_path = .
# URL береться з ALEMBIC_DATABASE_URL або DATABASE_URL (див. alembic/env.py)

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
